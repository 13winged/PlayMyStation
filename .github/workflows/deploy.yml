name: Deploy

# Деплой на прод-сервер по SSH при пуше в master (и вручную).
# Требует GitHub Secrets: SSH_HOST, SSH_PORT, SSH_USER, SSH_PRIVATE_KEY,
# GH_PAT (доступ contents:read к репозиторию), DOMAIN, ENV_PROD.

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: ENV_PROD,DOMAIN,GH_PAT
          script: |
            set -e
            mkdir -p ~/playmystation
            cd ~/playmystation
            if [ -d .git ]; then
              git pull --ff-only
            else
              git clone "https://x-access-token:${GH_PAT}@github.com/13winged/PlayMyStation.git" .
            fi
            printf '%s' "$ENV_PROD" > .env
            export DOMAIN
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
            docker system prune -f
            sleep 5
            curl -fsS http://localhost:8000/health
        env:
          ENV_PROD: ${{ secrets.ENV_PROD }}
          DOMAIN: ${{ secrets.DOMAIN }}
          GH_PAT: ${{ secrets.GH_PAT }}
