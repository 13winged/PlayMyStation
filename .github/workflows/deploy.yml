name: Deploy

# Деплой на прод-сервер по SSH при пуше в master (и вручную).
# Требует GitHub Secrets: SSH_HOST, SSH_PORT, SSH_USER, SSH_PRIVATE_KEY,
# DOMAIN, ENV_PROD.
# На сервере должен быть настроен SSH доступ к GitHub (Deploy Key с write access).

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: ENV_PROD,DOMAIN
          script: |
            set -e
            mkdir -p ~/.ssh
            # Add GitHub to known_hosts to avoid "Host key verification failed"
            ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
            chmod 644 ~/.ssh/known_hosts

            mkdir -p ~/playmystation
            cd ~/playmystation
            if [ -d .git ]; then
              # Force SSH remote in case it was HTTPS from old deploys
              git remote set-url origin git@github.com:13winged/PlayMyStation.git
              git pull --ff-only
            else
              git clone "git@github.com:13winged/PlayMyStation.git" .
            fi
            printf '%s' "$ENV_PROD" > .env
            export DOMAIN
            # Stop and remove existing containers, network and volumes to avoid conflicts
            docker compose -f docker-compose.yml -f docker-compose.prod.yml down --remove-orphans -v --rmi local
            # Wait for containers to fully stop
            sleep 20
            # Force remove any leftover containers
            docker rm -f playmystation-app-1 playmystation-postgres-1 playmystation-redis-1 playmystation-caddy-1 2>/dev/null || true
            docker network rm playmystation_default 2>/dev/null || true
            # Verify containers are removed
            docker ps -a --filter "name=playmystation-" --format "{{.Names}}" | xargs -r docker rm -f 2>/dev/null || true
            # Build with cache busting using git commit hash
            BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
            GIT_COMMIT=$(git rev-parse --short HEAD)
            docker compose -f docker-compose.yml -f docker-compose.prod.yml build --build-arg BUILD_DATE="$BUILD_DATE" --build-arg GIT_COMMIT="$GIT_COMMIT"
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
            docker system prune -f
            # Wait for app to be ready with retries
            for i in {1..30}; do
              if curl -fsS http://localhost:8000/health >/dev/null 2>&1; then
                echo "Health check passed"
                exit 0
              fi
              echo "Waiting for app... ($i/30)"
              sleep 2
            done
            echo "Health check failed after 60 seconds"
            exit 1
        env:
          ENV_PROD: ${{ secrets.ENV_PROD }}
          DOMAIN: ${{ secrets.DOMAIN }}
