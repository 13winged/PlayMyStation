services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: playmystation
      POSTGRES_PASSWORD: playmystation
      POSTGRES_DB: playmystation
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Go-сайдкар: транспорт для gRPC-стримов нативного протокола
  # Яндекс Музыки (Ynison). Слушает только внутри compose-сети.
  ynison:
    build: ./ynison-proxy
    expose:
      - "50051"

  app:
    build: .
    env_file: .env
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"

volumes:
  pgdata:
