[project]
name = "playmystation"
version = "0.1.0"
description = "PlayMyStation — мультиаккаунтный Telegram-бот: Spotify / Yandex Music / YouTube Music / Last.fm"
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.13,<4",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "redis>=5.0",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "yandex-music>=0.0.11",
  "ytmusicapi>=1.5",
  "cryptography>=42.0",
  "python-multipart>=0.0.9",
  "psycopg2-binary>=2.9",
  "grpcio>=1.60",
  "protobuf>=4.25",
  "certifi>=2024.0",
  "googleapis-common-protos>=1.60",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "aiosqlite>=0.19"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["alembic*", "tests*"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["app/services/ynison/pyproto"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
