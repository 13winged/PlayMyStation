# Прод-override поверх docker-compose.yml: рестарты + Caddy (авто-https).
# Запуск на сервере: DOMAIN=example.com docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
services:
  postgres:
    restart: unless-stopped
  redis:
    restart: unless-stopped
  app:
    restart: unless-stopped
  ynison:
    restart: unless-stopped
  backup:
    restart: unless-stopped
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:-music.example.com}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
